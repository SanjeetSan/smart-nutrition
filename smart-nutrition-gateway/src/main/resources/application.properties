server.port=8080
spring.application.name=API-GATEWAY-SERVICE
spring.config.import=optional:file:../secrets.properties

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_nutrition_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sanjeet}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka.instance.prefer-ip-address=true


eureka.instance.status-page-url-path=/swagger-ui/index.html
management.endpoints.web.exposure.include=*
info.app.name=smart-nutrition-gateway

# Swagger OpenAPI Aggregator (All APIs in 1 Single Page on Port 8080)
springdoc.swagger-ui.urls[0].name=Auth & User Admin Service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[1].name=AI Meal & Vision Service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs
springdoc.swagger-ui.urls[2].name=School & Report Service
springdoc.swagger-ui.urls[2].url=http://localhost:8083/v3/api-docs
springdoc.swagger-ui.urls[3].name=Messaging & Social Service
springdoc.swagger-ui.urls[3].url=http://localhost:8084/v3/api-docs

