# Server Configuration
server.port=8081
server.error.include-message=always

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_nutrition_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token.expiry=900000
jwt.refresh-token.expiry=604800000

# Meal Business Rules & Upload Windows
meal.premeal.upload.start=07:00
meal.premeal.upload.end=10:00
meal.postmeal.upload.start=12:00
meal.postmeal.upload.end=15:00

# Nutrition Target Allocation Settings
nutrition.lunch.allocation-ratio=0.35

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# File Upload Configuration
meal.image.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

