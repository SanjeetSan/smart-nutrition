# Server Configuration
server.port=8081
server.error.include-message=always

# Database Configuration (H2 In-Memory Database for instant test & development)
spring.datasource.url=jdbc:h2:mem:smart_nutrition_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token.expiry=900000
jwt.refresh-token.expiry=604800000

# Meal Business Rules & Upload Windows
meal.premeal.upload.start=07:00
meal.premeal.upload.end=10:00
meal.postmeal.upload.start=12:00
meal.postmeal.upload.end=15:00

# Nutrition Target Allocation Settings
nutrition.lunch.allocation-ratio=0.35

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# File Upload Configuration
meal.image.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

